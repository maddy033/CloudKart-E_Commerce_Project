services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/cloudkart
      NEXT_PUBLIC_API_URL: http://app:3000/api
    depends_on: 
      mongodb:
        condition: service_healthy
    networks:
      - cloudkart-network

  migration:
    build:
      context: .
      dockerfile: scripts/Dockerfile.migration
    environment:
      MONGODB_URI: mongodb://mongodb:27017/cloudkart
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cloudkart-network

  mongodb:
    image: mongo:6-jammy
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloudkart-network

volumes:
  mongodb_data:

networks:
  cloudkart-network:

  